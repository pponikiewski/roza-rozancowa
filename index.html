  <!-- Motyw i wielkość tekstu przed pierwszym renderem, bez mignięcia (te same klucze co ThemeProvider) -->
  <script>
    try {
      var root = document.documentElement
      var theme = localStorage.getItem('vite-ui-theme') || 'dark'
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      root.classList.add(theme)
      var senior = localStorage.getItem('vite-ui-senior-mode')
      if (senior === 'senior') root.classList.add('senior-mode')
      if (senior === 'ultra') root.classList.add('senior-mode', 'ultra-senior-mode')
      if (theme === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f4f6')
        // Jasny motyw: ciemny zegar na jasnym pasku zamiast białego na jasnym nagłówku
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default')
      }
    } catch (e) {}
  </script>
