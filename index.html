<!doctype html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
  <link rel="preconnect" href="https://jjlxuqnwbakmiwqfycha.supabase.co" crossorigin>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Motyw i wielkość tekstu przed pierwszym renderem, bez mignięcia (te same klucze co ThemeProvider) -->
  <script>
    try {
      var root = document.documentElement
      var theme = localStorage.getItem('vite-ui-theme') || 'dark'
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      root.classList.add(theme)
      var senior = localStorage.getItem('vite-ui-senior-mode')
      if (senior === 'senior') root.classList.add('senior-mode')
      if (senior === 'ultra') root.classList.add('senior-mode', 'ultra-senior-mode')
    } catch (e) {}
  </script>

  <!-- SEO & Social Media -->
  <title>Róża Różańcowa</title>
  <meta name="description" content="Aplikacja do zarządzania Różami Różańcowymi - dołącz do modlitwy!" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Róża Różańcowa" />
  <meta property="og:description" content="Aplikacja do zarządzania Różami Różańcowymi - dołącz do modlitwy!" />
  <meta property="og:image" content="/icon-512.png" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moja Róża" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
